<div class="create-dialog">
  <header class="create-dialog__header">
    <div>
      <p class="eyebrow">{{ 'newEvent' | uiText }}</p>
      <h2>{{ 'createEvent' | uiText }}</h2>
      <p class="muted">{{ 'eventEditableLater' | uiText }}</p>
    </div>
  </header>

  <div class="form-grid">
    <label>
      <span>{{ 'masterGpx' | uiText }}</span>
      <input type="file" accept=".gpx" (change)="handleGpxUpload($event)" />
    </label>
    <label>
      <span>{{ 'name' | uiText }}</span>
      <input type="text" [(ngModel)]="newEvent.name" [placeholder]="'eventName' | uiText" />
    </label>
    <label>
      <span>{{ 'eventUrlOptional' | uiText }}</span>
      <input type="url" [(ngModel)]="newEvent.eventUrl" maxlength="500" placeholder="https://..." />
    </label>
    <label>
      <span>{{ 'population' | uiText }}</span>
      <input type="text" [(ngModel)]="newEvent.population" [placeholder]="'townPlaceholder' | uiText" />
    </label>
    <label>
      <span>{{ 'county' | uiText }}</span>
      <input type="text" [(ngModel)]="newEvent.comarca" placeholder="Ej: Osona" />
    </label>
    <label>
      <span>{{ 'province' | uiText }}</span>
      <input type="text" [(ngModel)]="newEvent.province" placeholder="Ej: Barcelona" />
    </label>
    <label>
      <span>{{ 'autonomousCommunity' | uiText }}</span>
      <input type="text" [(ngModel)]="newEvent.autonomousCommunity" placeholder="Ej: Catalunya" />
    </label>
    <label>
      <span>{{ 'year' | uiText }}</span>
      <input type="number" [(ngModel)]="newEvent.year" />
    </label>
    <label>
      <span>{{ 'distanceKm' | uiText }}</span>
      <input type="number" [(ngModel)]="newEvent.distanceKm" [placeholder]="'calculatedFromGpx' | uiText" />
    </label>
    <label>
      <span>{{ 'optionalLogo' | uiText }}</span>
      <input type="file" accept="image/*" (change)="handleLogoUpload($event)" />
    </label>
  </div>

  <div class="actions">
    <button mat-button type="button" (click)="onCancel()">{{ 'cancel' | uiText }}</button>
    <button class="btn-start" type="button" (click)="onSave()">{{ 'saveEvent' | uiText }}</button>
  </div>
</div>
