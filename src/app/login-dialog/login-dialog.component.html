<h2 mat-dialog-title>{{ t('loginTitle') }}</h2>
<form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" novalidate>
  <mat-dialog-content>
    <p class="dialog-description">{{ t('loginDescription') }}</p>

    <label class="auth-field" for="login-email">
      <span>{{ t('email') }} <span aria-hidden="true">*</span></span>
      <input
        id="login-email"
        name="email"
        [(ngModel)]="email"
        #emailField="ngModel"
        type="email"
        required
        email
        autocomplete="email"
        placeholder="tu@correo.com"
      />
      <small class="auth-field__error" *ngIf="(emailField.touched || loginForm.submitted) && emailField.invalid">{{ t('validEmail') }}</small>
    </label>

    <label class="auth-field" for="login-password">
      <span>{{ t('password') }} <span aria-hidden="true">*</span></span>
      <input
        id="login-password"
        name="password"
        [(ngModel)]="password"
        #passwordField="ngModel"
        type="password"
        required
        minlength="4"
        autocomplete="current-password"
      />
      <small class="auth-field__error" *ngIf="(passwordField.touched || loginForm.submitted) && passwordField.invalid">{{ t('enterPassword') }}</small>
    </label>

    <button class="forgot-link" type="button" mat-button (click)="openForgotPasswordDialog()">
      {{ t('forgotPassword') }}
    </button>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button (click)="close()">{{ t('cancel') }}</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="loading">
      {{ loading ? t('signingIn') : t('loginTitle') }}
    </button>
  </mat-dialog-actions>
</form>
