<h2 mat-dialog-title class="dialog-header">
  {{ 'playbackOptions' | uiText }}
</h2>

<mat-dialog-content class="dialog-content">
  <p class="dialog-subtitle">
    {{ data.showColor
      ? ('playbackColorIntro' | uiText)
      : ('playbackNameIntro' | uiText) }}
  </p>

  <div class="track-list">
    <div class="track-row" *ngFor="let entry of entries; let i = index">
      <div class="track-label">
        <span class="badge">{{ i + 1 }}</span>
        <span>{{ 'course' | uiText }} {{ i + 1 }}</span>
      </div>

      <div class="track-inputs" [class.track-inputs--names-only]="!data.showColor">
        <label class="field">
          <span>{{ 'name' | uiText }}</span>
          <input type="text" [(ngModel)]="entry.name" [placeholder]="'courseName' | uiText" />
        </label>

        <label class="field color-field" *ngIf="data.showColor">
          <span>{{ 'color' | uiText }}</span>
          <input type="color" [(ngModel)]="entry.color" />
        </label>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button (click)="cancelar()">{{ 'cancel' | uiText }}</button>
  <button mat-flat-button color="primary" (click)="guardar()">{{ 'continue' | uiText }}</button>
</mat-dialog-actions>
