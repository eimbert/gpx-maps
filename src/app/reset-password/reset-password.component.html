<div class="reset-password">
  <div class="card">
    <h1>{{ 'resetTitle' | uiText }}</h1>
    <p>{{ 'resetIntro' | uiText }}</p>

    <form #resetForm="ngForm" (ngSubmit)="onSubmit(resetForm)" novalidate>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'newPassword' | uiText }}</mat-label>
        <input
          matInput
          name="password"
          [(ngModel)]="password"
          type="password"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'confirmPassword' | uiText }}</mat-label>
        <input
          matInput
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          type="password"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </mat-form-field>

      <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

      <button type="submit" mat-flat-button color="primary" [disabled]="loading || !token">
        {{ (loading ? 'saving' : 'updatePassword') | uiText }}
      </button>
    </form>
  </div>
</div>
