<h2 mat-dialog-title>{{ t('recoveryTitle') }}</h2>
<form #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)" novalidate>
  <mat-dialog-content>
    <p class="dialog-description">{{ t('recoveryDescription') }}</p>

    <label class="auth-field" for="recovery-email">
      <span>{{ t('email') }} <span aria-hidden="true">*</span></span>
      <input
        id="recovery-email"
        name="email"
        [(ngModel)]="email"
        #emailField="ngModel"
        type="email"
        required
        email
        autocomplete="email"
        placeholder="tu@correo.com"
      />
      <small class="auth-field__error" *ngIf="(emailField.touched || forgotForm.submitted) && emailField.invalid">{{ t('validEmail') }}</small>
    </label>

    <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button (click)="close()">{{ t('close') }}</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="loading">
      {{ loading ? t('sending') : t('sendLink') }}
    </button>
  </mat-dialog-actions>
</form>
