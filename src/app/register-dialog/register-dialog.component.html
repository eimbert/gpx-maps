<h2 mat-dialog-title>{{ t('createAccount') }}</h2>
<form
  *ngIf="!verificationEmailSent; else verificationState"
  #registerForm="ngForm"
  (ngSubmit)="onSubmit(registerForm)"
  novalidate
>
  <mat-dialog-content>
    <p class="dialog-description">
      {{ t('registerDescription') }}
    </p>

    <label class="auth-field" for="register-email">
      <span>{{ t('email') }} <span aria-hidden="true">*</span></span>
      <input
        id="register-email"
        name="email"
        [(ngModel)]="email"
        #emailField="ngModel"
        type="email"
        required
        email
        autocomplete="email"
        placeholder="tu@correo.com"
      />
      <small class="auth-field__error" *ngIf="(emailField.touched || registerForm.submitted) && emailField.invalid">{{ t('validEmail') }}</small>
    </label>

    <label class="auth-field" for="register-name">
      <span>{{ t('name') }} <span aria-hidden="true">*</span></span>
      <input
        id="register-name"
        name="name"
        [(ngModel)]="name"
        #nameField="ngModel"
        required
        autocomplete="name"
        [placeholder]="t('yourName')"
      />
      <small class="auth-field__error" *ngIf="(nameField.touched || registerForm.submitted) && nameField.invalid">{{ t('enterName') }}</small>
    </label>

    <label class="auth-field" for="register-nickname">
      <span>{{ t('nickname') }} <span aria-hidden="true">*</span></span>
      <input
        id="register-nickname"
        name="nickname"
        [(ngModel)]="nickname"
        #nicknameField="ngModel"
        required
        autocomplete="nickname"
        [placeholder]="t('appAlias')"
      />
      <small class="auth-field__error" *ngIf="(nicknameField.touched || registerForm.submitted) && nicknameField.invalid">{{ t('chooseNickname') }}</small>
    </label>

    <label class="auth-field" for="register-password">
      <span>{{ t('password') }} <span aria-hidden="true">*</span></span>
      <input
        id="register-password"
        name="password"
        [(ngModel)]="password"
        #passwordField="ngModel"
        type="password"
        required
        [pattern]="passwordPattern"
        minlength="6"
        autocomplete="new-password"
        [placeholder]="t('passwordMin')"
        aria-describedby="register-password-hint"
      />
      <small id="register-password-hint" class="auth-field__hint">{{ t('passwordRules') }}</small>
      <small class="auth-field__error" *ngIf="(passwordField.touched || registerForm.submitted) && passwordField.invalid">{{ t('passwordRequirements') }}</small>
    </label>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button (click)="close()">{{ t('cancel') }}</button>
    <button type="submit" mat-flat-button color="primary" [disabled]="loading">
      {{ loading ? t('registering') : t('register') }}
    </button>
  </mat-dialog-actions>
</form>

<ng-template #verificationState>
  <mat-dialog-content>
    <p class="dialog-description">
      {{ t('verificationSent') }}
    </p>

    <div class="verification-card">
      <p class="verification-title">{{ t('finishRegistration') }}</p>
      <ul>
        <li>{{ t('checkSpam') }}</li>
        <li>{{ t('expiredLink') }}</li>
      </ul>

      <div class="resend-row">
        <button
          type="button"
          mat-stroked-button
          color="primary"
          (click)="resendVerification()"
          [disabled]="loading || resendCountdown > 0"
        >
          {{ resendCountdown > 0 ? t('resendIn') + ' ' + resendCountdown + 's' : t('resendEmail') }}
        </button>
        <span class="resend-hint" *ngIf="resendCountdown > 0">{{ t('resendWhenTimer') }}</span>
      </div>
    </div>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button (click)="close()">{{ t('close') }}</button>
  </mat-dialog-actions>
</ng-template>
