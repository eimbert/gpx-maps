<h2 mat-dialog-title>{{ t('accountUnverified') }}</h2>
<mat-dialog-content>
  <p>{{ t('unverifiedMessage') }} <strong>{{ data.email }}</strong></p>
  <p>{{ t('resendPrompt') }}</p>

  <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">{{ t('close') }}</button>
  <button mat-flat-button color="primary" type="button" (click)="resendVerification()" [disabled]="loading">
    {{ loading ? t('sending') : t('resendEmail') }}
  </button>
</mat-dialog-actions>
