<h2 mat-dialog-title class="dialog-header">
  {{ 'routesMismatch' | uiText }}
</h2>

<mat-dialog-content class="dialog-content">
  <p class="dialog-subtitle">
    {{ 'routesMismatchIntro' | uiText }}
  </p>
  <p class="dialog-body">
    {{ 'minimumMatch' | uiText }} <strong>{{ data.percentage }}%</strong>. {{ 'mismatchWarning' | uiText }}
  </p>
  <p class="dialog-body">
    {{ 'continueAnyway' | uiText }}
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button (click)="cancelar()">{{ 'cancel' | uiText }}</button>
  <button mat-flat-button color="primary" (click)="continuar()">{{ 'continue' | uiText }}</button>
</mat-dialog-actions>
